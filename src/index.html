<!doctype html>
<!--
  PDFportal — the page inside every portal window.

  The same page is both shapes:
    • the PORTAL: a ring of tools under your cursor (#ring, drawn by ring.js)
    • the CARD:   what a job is doing, then its result (#card, card.js)
  app.js switches between them; Rust (src-tauri/src/portal.rs) moves and
  sizes the window to match.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDFportal</title>
  <link rel="stylesheet" href="styles/portal.css">
</head>
<body>
  <!-- Icons, used as <svg><use href="#i-NAME"/></svg> (see icon() in dom.js).
       24-unit grid, drawn with 1.8-unit round strokes. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-compress" viewBox="0 0 24 24"><path d="M12 3v6m0 0-3-3m3 3 3-3M12 21v-6m0 0-3 3m3-3 3 3M5 12h14"/></symbol>
      <symbol id="i-merge" viewBox="0 0 24 24"><path d="M7 3v4a5 5 0 0 0 5 5 5 5 0 0 0 5-5V3M12 12v9m-3-3 3 3 3-3"/></symbol>
      <symbol id="i-split" viewBox="0 0 24 24"><path d="M12 3v6m-3-3 3-3 3 3M12 9c0 3.5-5 4-5 8v4M12 9c0 3.5 5 4 5 8v4"/></symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 3.5v4.8h-4.8"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m20.5 15.5-4.8-4.8L7 19.5"/></symbol>
      <symbol id="i-hash" viewBox="0 0 24 24"><path d="M5 9h15M4 15h15M10.5 3.5 8.5 20.5M15.5 3.5l-2 17"/></symbol>
      <symbol id="i-stamp" viewBox="0 0 24 24"><path d="M12 3.2c3.6 4.3 6 7.5 6 10.6a6 6 0 0 1-12 0c0-3.1 2.4-6.3 6-10.6z"/><path d="M9.2 14.6a2.9 2.9 0 0 0 2.6 2.4"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5M12 14.5v2"/></symbol>
      <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 7.6-1.7M12 14.5v2"/></symbol>
      <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3.5H7.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/><path d="M14 3.5V8h4.5M9 13h6M9 16.5h4"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3.5H7.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/><path d="M14 3.5V8h4.5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5.5 12.5 4.2 4.2L18.5 8"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.8v5M12 16.3v.01"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2h7.2a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-open" viewBox="0 0 24 24"><path d="M13.5 4.5h6v6M19.5 4.5l-8 8M18 13.5v4a2 2 0 0 1-2 2H6.5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.4-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.4 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
    </defs>
  </svg>

  <!-- The portal. It's operated by dragging, so screen readers get the
       live text in the disk ("Compress: make it smaller…") instead. -->
  <main id="portal" class="portal" hidden>
    <div class="portal-glow" aria-hidden="true"></div>
    <svg id="ring" class="ring" viewBox="0 0 460 460" aria-hidden="true"></svg>
    <div id="disk" class="disk" role="status" aria-live="polite"></div>
  </main>

  <!-- The card (a job's progress and result, or the "how to use" hint). -->
  <section id="card" class="card" hidden aria-live="polite"></section>

  <script src="js/dom.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/ring.js"></script>
  <script src="js/card.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
