<!doctype html>
<!--
  PDFportal brand images, drawn with the app's own styles and ring code.

    brand.html?view=banner   the README's hero (1200 × 480)
    brand.html?view=social   GitHub's social preview (1280 × 640)
    brand.html?view=steps    "Drag. Shake. Drop." in three cards (1200 × 360)
    brand.html?view=tools    the ten tools as tiles (1200 × 400)
    brand.html?view=flow     how a drop becomes a file, in five cards (1200 × 176)
    brand.html?view=sidebar  the installer's welcome/finish picture (164 × 314)
    brand.html?view=header   the installer's page header (150 × 57)

  scripts/screenshots.ps1 renders them to PNGs in this folder. Open the page
  through a local server (it reads ../../src/index.html for the icons).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PDFportal brand</title>
  <link rel="stylesheet" href="../../src/styles/portal.css">
  <style>
    html, body { background: transparent; overflow: hidden; user-select: none; }
    body { margin: 0; position: relative; }

    /* ── Hero (banner and social) ─────────────────────────────────────── */
    .hero {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 36px;
      background:
        radial-gradient(circle at var(--glow-x) var(--glow-y), rgba(133, 79, 108, 0.42), rgba(133, 79, 108, 0) 46%),
        var(--night);
    }
    .hero.full { border-radius: 0; }  /* the social image: GitHub rounds and crops it itself */
    .hero-copy {
      position: absolute;
      left: var(--pad);
      top: 50%;
      translate: 0 -50%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 18px;
    }
    .mark { display: flex; align-items: center; gap: 14px; }
    .mark img { width: 58px; height: 58px; }
    .mark .chip { font-size: 13px; padding: 6px 12px; }
    .word { margin: 0; font-size: var(--word); color: var(--cream); letter-spacing: 0; line-height: 0.86; }
    .word em { font-style: normal; color: var(--rose); }
    .tag { font-size: var(--tag); color: var(--rose); letter-spacing: 0.06em; font-weight: 500; }
    .sub { margin: 0; max-width: 470px; font-size: 16px; line-height: 1.55; color: var(--rose); }
    .chips { display: flex; gap: 10px; margin-top: 6px; }
    .chips .chip { font-size: 13px; padding: 7px 14px; background: var(--violet); }

    /* The real ring, placed on the right, with its disk. */
    .hero .portal { left: var(--ring-x); top: var(--ring-y); translate: -50% -50%; scale: var(--ring-scale); }

    /* A file being shaken in, just outside the ring. */
    .file {
      position: absolute;
      width: 76px;
      height: 94px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: var(--cream);
      color: var(--night);
      box-shadow: 0 14px 30px rgba(12, 0, 14, 0.55);
    }
    .file .icon { width: 38px; height: 38px; stroke-width: 1.6; }
    .shake { position: absolute; display: flex; gap: 7px; }
    .shake i { display: block; width: 4px; border-radius: 4px; background: var(--rose); }

    /* ── Steps ─────────────────────────────────────────────────────────── */
    .steps { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 8px; }
    .step {
      position: relative;
      overflow: hidden;
      border-radius: 32px;
      background: var(--night);
      padding: 26px 28px;
      box-shadow: 0 0 0 1px var(--line-strong);
    }
    .step-n { font-size: 20px; color: var(--mauve); letter-spacing: 0.08em; }
    .step h2 { margin: 6px 0 8px; font-size: 54px; color: var(--cream); }
    .step p { margin: 0; max-width: 250px; font-size: 13.5px; line-height: 1.55; color: var(--rose); }
    .art { position: absolute; right: 22px; bottom: 22px; width: 150px; height: 150px; border-radius: 26px; background: var(--violet); }
    .art .file { width: 58px; height: 72px; border-radius: 14px; left: 46px; top: 39px; }
    .art .file .icon { width: 28px; height: 28px; }
    .cursor { position: absolute; width: 34px; height: 34px; left: 88px; top: 88px; fill: var(--cream); stroke: var(--night); stroke-width: 1.4; stroke-linejoin: round; }
    .mini-ring {
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: conic-gradient(from 22.5deg, var(--cream) 0 45deg, var(--mauve) 45deg 360deg);
      -webkit-mask:
        radial-gradient(circle, transparent 33px, #000 34px 56px, transparent 57px),
        repeating-conic-gradient(from 19deg, #000 0 39deg, transparent 39deg 45deg);
      -webkit-mask-composite: source-in;
      mask-composite: intersect;
    }

    /* ── Tools ─────────────────────────────────────────────────────────── */
    .tools { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; padding: 8px; }
    .tile {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 22px 20px;
      border-radius: 28px;
      background: var(--night);
      box-shadow: 0 0 0 1px var(--line-strong);
    }
    .tile .icon-badge { width: 52px; height: 52px; border-radius: 17px; background: var(--violet); color: var(--rose); margin-bottom: 6px; }
    .tile .icon-badge .icon { width: 26px; height: 26px; }
    .tile.lit .icon-badge { background: var(--cream); color: var(--night); }
    .tile h3 { margin: 0; font-size: 30px; color: var(--cream); }
    .tile p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--rose); }

    /* ── Flow ──────────────────────────────────────────────────────────── */
    .flow { position: absolute; inset: 0; display: flex; align-items: stretch; padding: 8px; }
    .node {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 20px 18px;
      border-radius: 26px;
      background: var(--night);
      box-shadow: 0 0 0 1px var(--line-strong);
    }
    .node.lit { background: var(--mauve); }
    .node .step-n { font-size: 15px; }
    .node.lit .step-n { color: var(--cream); }
    .node h3 { margin: 0; font-size: 25px; color: var(--cream); }
    .node p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--rose); }
    .node.lit p { color: var(--cream); }
    .arrow { flex: none; width: 34px; display: grid; place-items: center; color: var(--mauve); }
    .arrow .icon { width: 26px; height: 26px; stroke-width: 2.2; }

    /* ── Installer (NSIS) pictures: exact pixel sizes, no rounding ─────── */
    .nsis {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 50% 30%, rgba(133, 79, 108, 0.45), rgba(133, 79, 108, 0) 62%),
        var(--night);
    }
    .nsis.side { align-items: center; padding: 34px 14px 18px; gap: 4px; text-align: center; }
    .nsis.side img { width: 92px; height: 92px; margin-bottom: 14px; }
    .nsis.side .word { font-size: 31px; }
    .nsis.side .tag { font-size: 12.5px; letter-spacing: 0.08em; margin-top: 6px; }
    .nsis.side .fine { margin-top: auto; font-size: 10px; line-height: 1.6; color: var(--rose); }
    .nsis.head { flex-direction: row; align-items: center; gap: 8px; padding: 0 10px; background: var(--night); }
    .nsis.head img { width: 32px; height: 32px; }
    .nsis.head .word { font-size: 20px; }
  </style>
</head>
<body>
  <script src="../../src/js/dom.js"></script>
  <script src="../../src/js/tools.js"></script>
  <script src="../../src/js/ring.js"></script>
  <script>
    'use strict';

    const view = new URLSearchParams(location.search).get('view') || 'banner';

    // The icons live in the app's page; borrow its sprite.
    async function loadIcons() {
      const text = await (await fetch('../../src/index.html')).text();
      const sprite = new DOMParser().parseFromString(text, 'text/html').querySelector('svg defs').parentElement;
      document.body.prepend(document.importNode(sprite, true));
    }

    function fileTile(x, y, angle) {
      const tile = h('div', { class: 'file', style: `left:${x}px; top:${y}px; rotate:${angle}deg` }, icon('pdf'));
      return tile;
    }

    // Three short strokes either side of the file: it's being shaken.
    function shakeMarks(x, y, height, flip) {
      const bars = [height * 0.5, height, height * 0.7].map((hgt) => h('i', { style: `height:${hgt}px; align-self:center` }));
      return h('div', { class: 'shake', style: `left:${x}px; top:${y}px; height:${height}px; ${flip ? 'flex-direction:row-reverse' : ''}` }, bars);
    }

    function hero(size) {
      const social = size === 'social';
      const W = social ? 1280 : 1200;
      const H = social ? 640 : 480;
      const ringX = social ? 955 : 905;
      const ringY = H / 2;
      const hero = h('div', {
        class: `hero${social ? ' full' : ''}`,
        style: `--pad:${social ? 84 : 70}px; --word:${social ? 110 : 112}px; --tag:${social ? 36 : 32}px;`
          + `--ring-x:${ringX}px; --ring-y:${ringY}px; --ring-scale:${social ? 1.12 : 0.98};`
          + `--glow-x:${ringX}px; --glow-y:${ringY}px;`,
      });
      const copy = h('div', { class: 'hero-copy' },
        h('div', { class: 'mark' },
          h('img', { src: '../../src-tauri/icons/128x128@2x.png', alt: '' }),
          h('span', { class: 'chip' }, h('span', {}, 'v0.1 · Windows 10 & 11'))),
        h('h1', { class: 'word caps' }, 'PDF', h('em', {}, 'portal')),
        h('div', { class: 'tag caps' }, 'Drag. Shake. Drop.'),
        h('p', { class: 'sub' }, 'Free PDF tools that open right under your cursor. No website, no upload, no account.'),
        h('div', { class: 'chips' },
          ['Works offline', 'Free forever', 'Open source'].map((label) => h('span', { class: 'chip' }, h('span', {}, label)))),
      );

      // The portal, exactly as the app draws it, Compress lit.
      const svg = s('svg', { class: 'ring', viewBox: '0 0 460 460' });
      const disk = h('div', { class: 'disk lit' },
        h('div', { class: 'disk-face' },
          h('strong', { class: 'disk-title caps' }, 'Compress PDF'),
          h('span', { class: 'disk-text' }, 'Make it smaller to email or upload')));
      const portalEl = h('main', { class: 'portal' }, h('div', { class: 'portal-glow' }), svg, disk);
      hero.append(portalEl, copy);
      document.body.append(hero);
      Ring.mount(svg);
      Ring.setTools(['split', 'compress', 'rotate', 'pdf_to_images', 'page_numbers', 'watermark', 'protect', 'unlock']);
      Ring.setHot(1);

      // The file on its way in, top left of the ring.
      const fx = ringX - (social ? 330 : 300);
      const fy = ringY - (social ? 250 : 215);
      hero.append(fileTile(fx, fy, -10), shakeMarks(fx - 34, fy + 22, 48, true), shakeMarks(fx + 88, fy + 16, 48, false));
      document.body.style.width = `${W}px`;
      document.body.style.height = `${H}px`;
    }

    function steps() {
      const cursor = () => s('svg', { class: 'cursor', viewBox: '0 0 24 24' }, s('path', { d: 'M5 3l14 8.2-6.1 1.3 3.6 6.9-3 1.5-3.6-6.9L5 18.2z' }));
      const card = (n, title, text, art) => h('div', { class: 'step' },
        h('div', { class: 'step-n caps' }, n),
        h('h2', { class: 'caps' }, title),
        h('p', {}, text),
        h('div', { class: 'art' }, ...art));
      const shaken = fileTile(46, 39, -8);
      document.body.append(h('div', { class: 'steps' },
        card('01', 'Drag', 'Pick up any PDF or image, from File Explorer, your desktop or a download.',
          [fileTile(46, 39, 0), cursor()]),
        card('02', 'Shake', 'Give it a quick shake while you hold it. The portal opens under your cursor.',
          [shaken, shakeMarks(18, 52, 44, true), shakeMarks(112, 52, 44, false)]),
        card('03', 'Drop', 'Let go on a tool. The result lands right next to your original file.',
          [h('div', { class: 'mini-ring' }), h('div', { class: 'file', style: 'width:34px;height:42px;border-radius:9px;left:88px;top:24px;rotate:12deg' }, icon('pdf'))]),
      ));
      document.body.style.width = '1200px';
      document.body.style.height = '360px';
    }

    function tools() {
      const order = ['compress', 'merge', 'split', 'rotate', 'pdf_to_images', 'page_numbers', 'watermark', 'protect', 'unlock', 'images_to_pdf'];
      document.body.append(h('div', { class: 'tools' }, order.map((id, k) => {
        const tool = TOOLS[id];
        return h('div', { class: `tile${k === 0 ? ' lit' : ''}` },
          h('span', { class: 'icon-badge' }, icon(tool.icon)),
          h('h3', { class: 'caps' }, tool.label),
          h('p', {}, tool.desc));
      })));
      document.body.style.width = '1200px';
      document.body.style.height = '400px';
    }

    function flow() {
      const nodes = [
        ['01', 'You', 'Drag any file and give it a quick shake.'],
        ['02', 'The hook', 'shake.rs notices the shake from the mouse alone.'],
        ['03', 'The portal', 'portal.rs opens the ring; droptarget.rs takes the file.'],
        ['04', 'The engine', 'Python + PyMuPDF does the work, off to one side.'],
        ['05', 'The card', 'Progress, then your file, right next to the original.'],
      ];
      const parts = [];
      nodes.forEach(([n, title, text], k) => {
        if (k) parts.push(h('div', { class: 'arrow' }, s('svg', { class: 'icon', viewBox: '0 0 24 24', 'aria-hidden': 'true' }, s('path', { d: 'M5 12h13m-5-5 5 5-5 5' }))));
        parts.push(h('div', { class: `node${k === 2 ? ' lit' : ''}` },
          h('span', { class: 'step-n caps' }, n), h('h3', { class: 'caps' }, title), h('p', {}, text)));
      });
      document.body.append(h('div', { class: 'flow' }, parts));
      document.body.style.width = '1200px';
      document.body.style.height = '176px';
    }

    function installer(kind) {
      const side = kind === 'sidebar';
      const logo = h('img', { src: '../../src-tauri/icons/128x128@2x.png', alt: '' });
      const word = h('div', { class: 'word caps' }, 'PDF', h('em', {}, 'portal'));
      document.body.append(side
        ? h('div', { class: 'nsis side' }, logo, word, h('div', { class: 'tag caps' }, 'Drag. Shake. Drop.'),
            h('div', { class: 'fine' }, 'Free · offline', h('br'), 'open source'))
        : h('div', { class: 'nsis head' }, logo, word));
      document.body.style.width = side ? '164px' : '150px';
      document.body.style.height = side ? '314px' : '57px';
    }

    const views = { steps, tools, flow, sidebar: () => installer('sidebar'), header: () => installer('header') };
    loadIcons().then(() => (views[view] ? views[view]() : hero(view)));
  </script>
</body>
</html>
